<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nítida</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>Nítida</h1>
      <p class="sub">Ampliação de imagens com IA, no seu computador</p>
    </div>
  </div>
  <span class="engine" id="engine" role="status">verificando motor…</span>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-work" aria-selected="true" aria-controls="view-work">Ampliar</button>
  <button role="tab" id="tab-hist" aria-selected="false" aria-controls="view-hist">Histórico</button>
</nav>

<main>
  <section id="view-work" role="tabpanel" aria-labelledby="tab-work">
    <form class="settings" id="settings" aria-label="Configuração">
      <fieldset>
        <legend>Tipo de imagem</legend>
        <label><input type="radio" name="style" value="art" checked> Desenho / anime</label>
        <label><input type="radio" name="style" value="photo"> Foto</label>
      </fieldset>
      <fieldset>
        <legend>Ampliação</legend>
        <label><input type="radio" name="scale" value="2" checked> 2x</label>
        <label><input type="radio" name="scale" value="4"> 4x</label>
        <label><input type="radio" name="scale" value="8"> 8x</label>
        <label><input type="radio" name="scale" value="16"> 16x</label>
      </fieldset>
      <fieldset>
        <legend>Redução de ruído</legend>
        <label><input type="radio" name="noise" value="-1"> Nenhuma</label>
        <label><input type="radio" name="noise" value="0"> Baixa</label>
        <label><input type="radio" name="noise" value="1" checked> Média</label>
        <label><input type="radio" name="noise" value="2"> Alta</label>
        <label><input type="radio" name="noise" value="3"> Máxima</label>
      </fieldset>
      <fieldset>
        <legend>Formato de saída</legend>
        <label><input type="radio" name="format" value="default" checked> Igual ao original</label>
        <label><input type="radio" name="format" value="webp"> WebP</label>
        <label><input type="radio" name="format" value="jpg"> JPG</label>
        <label><input type="radio" name="format" value="png"> PNG</label>
      </fieldset>
    </form>

    <label class="drop" id="drop" for="files">
      <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple>
      <strong>Solte imagens aqui ou clique para escolher</strong>
      <span>JPG, PNG ou WebP, até 50 MB cada. Você pode enviar várias de uma vez.</span>
    </label>

    <div class="bar-actions" id="queue-actions" hidden>
      <span id="queue-count"></span>
      <div class="spacer"></div>
      <button type="button" class="btn" id="clear-done">Limpar concluídas</button>
      <button type="button" class="btn" id="zip-session">Baixar concluídas (ZIP)</button>
      <button type="button" class="btn primary" id="start-all">Ampliar todas</button>
    </div>

    <ul class="items" id="queue" aria-live="polite"></ul>
  </section>

  <section id="view-hist" role="tabpanel" aria-labelledby="tab-hist" hidden>
    <div class="bar-actions">
      <label class="check-all"><input type="checkbox" id="hist-all"> Selecionar página</label>
      <div class="spacer"></div>
      <button type="button" class="btn" id="hist-zip" disabled>Baixar selecionadas (ZIP)</button>
      <button type="button" class="btn danger" id="hist-del" disabled>Excluir selecionadas</button>
    </div>
    <ul class="items" id="history"></ul>
    <div class="pager">
      <button type="button" class="btn" id="hist-prev">Anterior</button>
      <span id="hist-page"></span>
      <button type="button" class="btn" id="hist-next">Próxima</button>
    </div>
  </section>
</main>

<dialog id="compare" aria-labelledby="cmp-title">
  <div class="cmp-head">
    <h2 id="cmp-title">Antes e depois</h2>
    <button type="button" class="btn" id="cmp-close">Fechar</button>
  </div>
  <div class="cmp-stage" id="cmp-stage">
    <img id="cmp-after" alt="Depois">
    <div class="cmp-before" id="cmp-before-wrap"><img id="cmp-before" alt="Antes"></div>
    <div class="cmp-handle" id="cmp-handle" aria-hidden="true"></div>
    <span class="cmp-tag left">Antes</span><span class="cmp-tag right">Depois</span>
  </div>
  <input type="range" id="cmp-range" min="0" max="100" value="50" aria-label="Posição da comparação">
</dialog>

<div class="toast" id="toast" role="alert" hidden></div>
<script src="/app.js"></script>
</body>
</html>
